/* MATRIX */

.matrix-head-scroll{position:sticky;top:0;z-index:500;width:100%;overflow-x:auto;overflow-y:hidden;background:#fff;border-bottom:1px solid #9ca3af;-ms-overflow-style:none;scrollbar-width:none}

.matrix-head-table .col-dept{width:38px}.matrix-head-table .col-sep{width:9px}

.matrix-scroll .matrix>thead{display:none}
@media(max-width:700px){
 /* IMPORTANTE: encabezado y celdas deben usar exactamente el mismo ancho.
    Antes el encabezado usaba 34px y la tabla inferior 38px, provocando
    un desfase cada vez mayor al desplazarse horizontalmente. */
 .matrix-head-table,.matrix{width:726px!important;min-width:726px!important;max-width:none!important}
 .matrix-head-table .conceptcol,.matrix .conceptcol{width:155px!important;min-width:155px!important;max-width:155px!important}
 .matrix-head-table .col-dept,.matrix .col-dept{min-width:34px!important}
 .matrix-head-table .col-sep,.matrix .col-sep{width:9px!important;min-width:9px!important;max-width:9px!important}
 .matrix-head-table .dept,.matrix .dept,.matrix td.data-cell{min-width:34px!important;box-sizing:border-box}
 .matrix-head-table .level-sep,.matrix .level-sep,.matrix .sep-cell{width:9px!important;min-width:9px!important;max-width:9px!important;box-sizing:border-box}
 .matrix-head-table .level{font-size:18px;height:34px;line-height:34px}
}

.matrix-scroll{overflow-x:auto;overflow-y:clip;-webkit-overflow-scrolling:touch;max-height:none;position:relative;isolation:isolate}

.matrix col.col-concept{width:155px}.matrix col.col-dept{width:38px}.matrix col.col-sep{width:9px}
.matrix .dept{width:38px;min-width:38px;text-align:center}.matrix .level-sep{width:9px;min-width:9px;background:#eef1f5!important;border-left:2px solid #eef1f5!important;border-right:2px solid #eef1f5!important;padding:0!important}.matrix .sep-cell{width:9px;min-width:9px;background:#eef1f5!important;border-left:2px solid #eef1f5!important;border-right:2px solid #eef1f5!important;padding:0!important;cursor:default}
/* La columna de conceptos queda fija; las columnas de departamentos se deslizan. */
.matrix tbody td:nth-child(1){
  position:sticky;left:0;z-index:100;
  background:#b9d8f0!important;
  border-right:2px solid #6f7882;
}

  background:#8eb9d9!important;
  z-index:110;
}
.matrix thead th:nth-child(1){
  position:sticky;left:0;z-index:200;background:#f4f4f4!important;
}
/* Encabezado de niveles y departamentos fijo al desplazarse verticalmente. */

.level{background:#f4f4f4;font-size:14px;font-weight:700;height:25px;text-align:center}
.depthead{background:#fff;font-size:12px;height:22px;text-align:center}
.catcell{background:#b9d8f0;color:#111;font-size:7px;text-transform:uppercase;vertical-align:top;padding:3px 2px;position:sticky;left:0;z-index:6;overflow:hidden;white-space:nowrap;text-overflow:clip}

.category-title{font-weight:700;font-size:11px;background:#8eb9d9!important}.category-banner{font-size:10px;text-transform:uppercase}

.base-color-picker{margin-top:3px;background:#f8fafc;border:1px solid #d7dde5;border-radius:10px;padding:8px}.base-color-current{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:10px;color:#4b5563;font-weight:700;margin-bottom:7px}.base-color-preview{width:30px;height:24px;border:1px solid #8f98a3;border-radius:5px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}.base-color-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.base-color-title{font-size:10px;font-weight:800;color:#596273;margin:5px 0 4px}.base-color-grid{display:grid;grid-template-columns:repeat(8,minmax(18px,1fr));gap:4px}.base-color-swatch{height:22px;min-width:18px;border:1px solid #aab2bd;border-radius:4px;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}.base-color-swatch:active{transform:scale(.94)}.base-color-custom{width:100%;margin-top:7px;border:1px solid #b8c0ca;background:#fff;border-radius:6px;padding:6px;font-weight:700;color:#334155}.base-color-custom:active{background:#eef2f7}@media(max-width:700px){.base-color-grid{grid-template-columns:repeat(8,minmax(16px,1fr))}.base-color-swatch{height:20px}.base-color-picker{padding:6px}}
.color-input{width:40px;height:34px;padding:2px}

@media(max-width:700px){
 .topbar{height:52px;padding:0 11px}.logo{font-size:17px}

<script>
const STORE='controlObraMatrixV1';
const CATEGORY_CLIPBOARD='controlObraCategoryClipboardV1';
const DEFAULT_STATUSES=[
  {id:'st_done',name:'Terminado',color:'#c6efce'},
  {id:'st_process',name:'En proceso',color:'#fce4d6'},
  {id:'st_pending',name:'Pendiente',color:'#fff2cc'},
  {id:'st_review',name:'Revisar',color:'#cfe2f3'},
  {id:'st_na',name:'No aplica',color:'#e7e6e6'},
  {id:'st_qty',name:'Cantidad',color:'#f4cccc',textColor:'#c00000',mode:'quantity'}
];
let state=JSON.parse(localStorage.getItem(STORE)||'{"buildings":[]}');
if(!Array.isArray(state.statuses)||!state.statuses.length) state.statuses=DEFAULT_STATUSES.map(x=>({...x}));
// Cada categoría conserva su propia lista de estatus y colores.
state.buildings.forEach(b=>(b.categories||[]).forEach(c=>{
  if(!Array.isArray(c.statuses)||!c.statuses.length) c.statuses=state.statuses.map(x=>({...x,id:uid()}));

const UNDO_STORE='controlObraUndoV1';
let undoHistory=[];
let redoHistory=[];
let lastSavedSnapshot=JSON.stringify(state);
let historyNavigation=false;

// Historial de cambios: guarda hasta 50 estados anteriores para poder deshacer.
(function loadUndoHistory(){
  try{
    const raw=localStorage.getItem(UNDO_STORE);
    const data=raw?JSON.parse(raw):null;
    if(data && data.current===lastSavedSnapshot && Array.isArray(data.history)) undoHistory=data.history.slice(-50);
    if(data && data.current===lastSavedSnapshot && Array.isArray(data.redo)) redoHistory=data.redo.slice(-50);
  }catch(e){ undoHistory=[]; }
})();

function persistUndoHistory(){
  try{ localStorage.setItem(UNDO_STORE,JSON.stringify({current:lastSavedSnapshot,history:undoHistory,redo:redoHistory})); }catch(e){}
  updateUndoButton();
}
function updateUndoButton(){
  const btn=document.getElementById('undoBtn');
  const redo=document.getElementById('redoBtn');
  if(btn){ btn.disabled=undoHistory.length===0; btn.title=undoHistory.length?'Deshacer el último cambio':'No hay cambios para deshacer'; }
  if(redo){ redo.disabled=redoHistory.length===0; redo.title=redoHistory.length?'Adelantar el último cambio':'No hay cambios para adelantar'; }
}
function save(){
  const snapshot=JSON.stringify(state);
  if(snapshot!==lastSavedSnapshot){
    undoHistory.push(lastSavedSnapshot);
    if(undoHistory.length>50) undoHistory.shift();
    if(!historyNavigation) redoHistory=[];
    lastSavedSnapshot=snapshot;
    localStorage.setItem(STORE,snapshot);
    persistUndoHistory();
  }else{
    localStorage.setItem(STORE,snapshot);
    persistUndoHistory();
  }
}
function applyHistorySnapshot(snapshot){
  state=JSON.parse(snapshot);
  lastSavedSnapshot=JSON.stringify(state);
  localStorage.setItem(STORE,lastSavedSnapshot);
  persistUndoHistory();
  if(currentId && state.buildings.some(b=>b.id===currentId)){
    renderMatrix();
  }else{
    currentId=null;
    goHome();
  }
  if(typeof renderConsolidated==='function') renderConsolidated();
  updateUndoButton();
}
function undoLastChange(){
  if(!undoHistory.length)return;
  const previous=undoHistory.pop();
  try{
    historyNavigation=true;
    redoHistory.push(lastSavedSnapshot);
    if(redoHistory.length>50) redoHistory.shift();
    applyHistorySnapshot(previous);
    historyNavigation=false;
    persistUndoHistory();
  }catch(e){ historyNavigation=false; console.error(e); }
}
function redoLastChange(){
  if(!redoHistory.length)return;
  const next=redoHistory.pop();
  try{
    historyNavigation=true;
    undoHistory.push(lastSavedSnapshot);
    if(undoHistory.length>50) undoHistory.shift();
    applyHistorySnapshot(next);
    historyNavigation=false;
    persistUndoHistory();
  }catch(e){ historyNavigation=false; console.error(e); }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function normalizeImportedState(raw){
  const incoming=(raw && raw.state) ? raw.state : raw;
  if(!incoming || typeof incoming!=='object' || !Array.isArray(incoming.buildings)) throw new Error('El archivo no contiene datos válidos de Control de Obra.');
  if(!Array.isArray(incoming.statuses)||!incoming.statuses.length) incoming.statuses=DEFAULT_STATUSES.map(x=>({...x}));
  incoming.buildings.forEach(b=>{
    if(!b.color) b.color='#eef1f5';
    if(!Array.isArray(b.categories)) b.categories=[];
    b.categories.forEach(c=>{
      if(!Array.isArray(c.statuses)||!c.statuses.length) c.statuses=incoming.statuses.map(x=>({...x,id:uid()}));
      c.statuses.forEach(st=>{ if(!st.id) st.id=uid(); if(!st.textColor) st.textColor=st.mode==='quantity'?'#c00000':'#111111'; if(!st.mode) st.mode='normal'; });
      if(!c.statuses.some(st=>st.mode==='quantity')) c.statuses.push({id:uid(),name:'Cantidad',color:'#f4cccc',textColor:'#c00000',mode:'quantity'});
      if(!c.color) c.color='#8eb9d9';
      if(c.visible===undefined) c.visible=true;
      if(!c.fontSize) c.fontSize=11;
      if(!c.fontColor) c.fontColor='#111111';
      if(!Array.isArray(c.concepts)) c.concepts=[];
      c.concepts.forEach(x=>{
        if(!x.id) x.id=uid();
        if(!x.color) x.color='#b9d8f0';
        if(!x.fontColor) x.fontColor='#111111';
        if(!x.values || typeof x.values!=='object') x.values={};
      });
    });
  });
  return incoming;
}

function exportProgress(){
  try{
    const payload={
      app:'Control de Obra',
      format:'controlObraMatrixV1',
      version:1,
      exportedAt:new Date().toISOString(),
      state:state
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const stamp=new Date().toISOString().slice(0,10);
    a.href=url;
    a.download='Control_Obra_Avances_'+stamp+'.json';
    document.body.appendChild(a);
    a.click();

  }catch(e){

  }
}

function importProgressFile(input){
  const file=input.files && input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const parsed=JSON.parse(reader.result);
      const imported=normalizeImportedState(parsed);
      const count=imported.buildings.length;
      if(!confirm('Se cargarán '+count+' edificio(s) del archivo y se reemplazarán los datos actuales de esta aplicación.\n\n¿Continuar?')){ input.value=''; return; }
      state=imported;
      localStorage.setItem(STORE,JSON.stringify(state));
      undoHistory=[];
      lastSavedSnapshot=JSON.stringify(state);
      try{localStorage.setItem(UNDO_STORE,JSON.stringify({current:lastSavedSnapshot,history:[]}));}catch(e){}
      currentId=null;
      activeCell=null;
      closeStatusMenu();
      closeProjectSummary();
      const preview=document.getElementById('projectPreview'); if(preview) preview.remove();
      document.body.style.overflow='';
      document.documentElement.style.overflow='';
      goHome();
      renderConsolidated();
      updateUndoButton();
      alert('Avances importados correctamente.');
    }catch(e){
      console.error(e);
      alert('El archivo no es válido o no pertenece a Control de Obra.');
    }finally{
      input.value='';
    }
  };
  reader.onerror=function(){ input.value=''; alert('No se pudo leer el archivo.'); };
  reader.readAsText(file);
}

function openStatusMenu(cell){
  const menu=document.getElementById('statusMenu');
  activeCell=cell;
  const b=state.buildings.find(x=>x.id===currentId);
  const cat=b && b.categories.find(x=>x.id===cell.dataset.cid);
  const statuses=getCategoryStatuses(cat);
  let html=`<div style="font-weight:700;padding:5px 8px 7px;border-bottom:1px solid #e5e7eb;margin-bottom:3px">${esc(cat?.name||'Estatus')}</div>`;
  html+=`<button class="status-option status-empty" onclick="requestStatusConfirmation('')">✕ Sin estatus</button>`;
  html+=`<button class="status-option" onclick="closeStatusMenu()" style="justify-content:center;color:#b42318;border-top:1px solid #e5e7eb;margin-top:3px;padding-top:10px">↩ Cancelar</button>`;
  statuses.forEach(st=>{
    const tag=st.mode==='quantity'?' · cantidad':'';
    html+=`<button class="status-option" onclick="requestStatusConfirmation('${st.id}')">
      <span class="status-dot" style="background:${esc(st.color)};border-color:${esc(st.textColor||'#999')}"></span><span style="color:${esc(st.textColor||'#111')}">${esc(st.name)}${esc(tag)}</span>
    </button>`;
  });
  const currentValue=cat && cell.dataset.xid ? cat.concepts.find(x=>x.id===cell.dataset.xid)?.values?.[cell.dataset.dept] : null;
  const hasCopiedStatus=!!loadStatusClipboard();
  const canCopy=!!currentValue;
  html+=`<div style="border-top:1px solid #e5e7eb;margin-top:5px;padding-top:5px">
    <button class="status-option" ${canCopy?'':'disabled'} onclick="copyCellStatus();event.stopPropagation();return false;">📋 Copiar estatus</button>
    <button class="status-option" ${hasCopiedStatus?'':'disabled'} onclick="pasteCellStatus();event.stopPropagation();return false;">📥 Pegar estatus${hasCopiedStatus?'':' (vacío)'}</button>
  </div>`;
  menu.innerHTML=html;
  menu.classList.remove('hidden');

  // El menú de estatus puede contener muchos elementos.
  // Se calcula su tamaño real y se coloca donde haya más espacio,
  // dejando siempre una zona desplazable para llegar a los últimos estatus.
  const r=cell.getBoundingClientRect();
  const margin=8;
  const gap=5;
  const w=Math.min(320,Math.max(190,window.innerWidth-16));
  menu.style.width='auto';
  menu.style.maxHeight='calc(100vh - 16px)';
  let left=Math.min(r.left,window.innerWidth-w-margin);
  left=Math.max(margin,left);
  menu.style.left=left+'px';

  const availableBelow=Math.max(40,window.innerHeight-r.bottom-margin-gap);
  const availableAbove=Math.max(40,r.top-margin-gap);
  const naturalHeight=menu.scrollHeight;
  const maxHeight=Math.max(120,Math.min(window.innerHeight-16,Math.max(availableBelow,availableAbove)));
  menu.style.maxHeight=maxHeight+'px';

  // Preferimos abrir debajo. Si no cabe, abrimos arriba.
  const finalHeight=Math.min(naturalHeight,maxHeight);
  let top=r.bottom+gap;
  if(finalHeight>availableBelow && availableAbove>availableBelow){
    top=Math.max(margin,r.top-gap-finalHeight);
  }else{
    top=Math.min(top,window.innerHeight-margin-finalHeight);
    top=Math.max(margin,top);
  }
  menu.style.top=top+'px';
}

const STATUS_CLIPBOARD='controlObraStatusClipboardV1';
function loadStatusClipboard(){
  try{
    const raw=localStorage.getItem(STATUS_CLIPBOARD);

  }catch(e){ return null; }
}
function copyCellStatus(){
  if(!activeCell)return;
  const b=state.buildings.find(x=>x.id===currentId);
  const c=b && b.categories.find(x=>x.id===activeCell.dataset.cid);
  const x=c && c.concepts.find(x=>x.id===activeCell.dataset.xid);
  const value=x && x.values ? x.values[activeCell.dataset.dept] : null;
  if(!value){ alert('Esta celda no tiene un estatus para copiar.'); return; }
  const st=statusForValue(value,c);
  if(!st){ alert('No se pudo identificar el estatus de esta celda.'); return; }
  const clip={statusName:st.name,mode:st.mode||'normal',quantity:st.mode==='quantity' ? (value.quantity??'') : null};
  try{ localStorage.setItem(STATUS_CLIPBOARD,JSON.stringify(clip)); }catch(e){}
  closeStatusMenu();
  alert(`Estatus copiado: ${st.name}${st.mode==='quantity' ? ' · '+String(value.quantity??'') : ''}`);
}
function pasteCellStatus(){
  if(!activeCell)return;
  const clip=loadStatusClipboard();
  if(!clip){ alert('No hay un estatus copiado.'); return; }
  const b=state.buildings.find(x=>x.id===currentId);
  const c=b && b.categories.find(x=>x.id===activeCell.dataset.cid);
  if(!c)return;
  const statuses=getCategoryStatuses(c);
  let st=statuses.find(s=>String(s.name||'').trim().toLowerCase()===String(clip.statusName||'').trim().toLowerCase());
  if(!st && clip.mode==='quantity') st=statuses.find(s=>s.mode==='quantity');
  if(!st){
    alert(`La categoría destino no tiene el estatus “${clip.statusName}”.`);
    return;
  }
  const cid=activeCell.dataset.cid,xid=activeCell.dataset.xid,dept=activeCell.dataset.dept;
  const x=c.concepts.find(x=>x.id===xid);
  if(!x)return;
  x.values=x.values||{};
  if(st.mode==='quantity'){
    const q=String(clip.quantity??'').trim();
    if(q===''){ alert('El estatus copiado no tiene una cantidad válida.'); return; }
    x.values[dept]={statusId:st.id,quantity:q};
  }else{
    x.values[dept]={statusId:st.id};
  }
  save();
  const cell=document.querySelector(`.data-cell[data-cid="${CSS.escape(cid)}"][data-xid="${CSS.escape(xid)}"][data-dept="${CSS.escape(dept)}"]`);
  if(cell){

function requestStatusConfirmation(statusId){
  if(!activeCell)return;
  const b=state.buildings.find(x=>x.id===currentId);
  const c=b && b.categories.find(x=>x.id===activeCell.dataset.cid);
  const st=statusId ? getCategoryStatuses(c).find(s=>s.id===statusId) : null;
  const name=st ? st.name : 'Sin estatus';
  const confirmBox=document.getElementById('statusConfirm') || document.createElement('div');
  confirmBox.id='statusConfirm';
  confirmBox.className='status-confirm';
  confirmBox.innerHTML=`<div class="status-confirm-text">¿Quieres aplicar el estatus<br><strong>“${esc(name)}”</strong>?</div>
    <div class="status-confirm-actions">
      <button type="button" class="cancel" onclick="cancelStatusConfirmation()">Cancelar</button>
      <button type="button" class="ok" onclick="confirmStatusApplication()">OK</button>
    </div>`;
  if(!confirmBox.parentNode) document.body.appendChild(confirmBox);
  confirmBox.dataset.statusId=statusId;
  const menu=document.getElementById('statusMenu');
  const mr=menu.getBoundingClientRect();
  // El candado queda DEBAJO del menú de estatus para no tapar las opciones
  // ni los botones de la matriz. Si no cabe abajo, se coloca arriba como último recurso.
  const w=220;
  const gap=7;
  let left=Math.min(mr.left,window.innerWidth-w-8);
  left=Math.max(8,left);
  let top=mr.bottom+gap;
  if(top+100>window.innerHeight-8){
    top=Math.max(8,mr.top-100-gap);
  }
  confirmBox.style.left=left+'px';
  confirmBox.style.top=top+'px';
  confirmBox.classList.remove('hidden');
}

function cancelStatusConfirmation(){
  const box=document.getElementById('statusConfirm');
  if(box) box.classList.add('hidden');
}

function confirmStatusApplication(){
  if(!activeCell)return;
  const box=document.getElementById('statusConfirm');
  const statusId=box ? (box.dataset.statusId||'') : '';
  if(box) box.classList.add('hidden');
  applyCellStatus(statusId);
}

function applyCellStatus(statusId){
  if(!activeCell)return;
  const cid=activeCell.dataset.cid,xid=activeCell.dataset.xid,dept=activeCell.dataset.dept;
  const b=state.buildings.find(x=>x.id===currentId);
  if(!b)return;
  const c=b.categories.find(x=>x.id===cid);
  if(!c)return;
  const x=c.concepts.find(x=>x.id===xid);
  if(!x)return;
  x.values=x.values||{};
  if(statusId){
    const st=getCategoryStatuses(c).find(s=>s.id===statusId);
    if(st && st.mode==='quantity'){
      const previous=x.values[dept]?.quantity ?? '';
      const entered=prompt('Escribe la cantidad (puede ser negativa):', previous);
      if(entered===null)return;
      const clean=String(entered).trim().replace(',', '.');
      if(clean===''){ delete x.values[dept]; }
      else if(!isFinite(Number(clean))){ alert('Escribe una cantidad numérica.'); return; }
      else x.values[dept]={statusId,quantity:clean};
    }else x.values[dept]={statusId};
  }else delete x.values[dept];
  save();

  // Actualiza únicamente la celda modificada para evitar reconstruir toda la matriz.
  // Esto hace que el cambio de estatus sea mucho más rápido en móviles.
  const cell=document.querySelector(`.data-cell[data-cid="${CSS.escape(cid)}"][data-xid="${CSS.escape(xid)}"][data-dept="${CSS.escape(dept)}"]`);
  if(cell){
    const value=x.values[dept];
    const current=statusForValue(value,c);
    cell.style.background=current ? current.color : '';
    cell.style.color=current ? (current.textColor||'#111111') : '';
    cell.textContent=current ? (current.mode==='quantity' ? String(value.quantity??'') : current.name) : '';
    cell.title=current ? (current.mode==='quantity' ? 'Cantidad: '+String(value.quantity??'') : current.name) : 'Seleccionar estatus';
    // Solo recalcula anchos si el contenido puede cambiar el ancho de la columna.
    if(current && (current.mode==='quantity' || String(current.name||'').length>5)) syncMatrixColumnWidths();
  }
  closeStatusMenu();
}
function statusForValue(v,category){
  if(!v)return null;
  const statuses=getCategoryStatuses(category);
  if(typeof v==='string'){
    return statuses.find(st=>st.name.toLowerCase()===v.toLowerCase()) || null;
  }
  return statuses.find(st=>st.id===v.statusId) || null;
}

function renderConsolidated(){
  const body=document.getElementById('consolidatedBody');
  let rows='';
  state.buildings.forEach(b=>{
    b.categories.forEach(c=>{
      c.concepts.forEach(x=>{
        let done=0,process=0,pending=0,other=0;
        depts.forEach(d=>{
          const raw=x.values&&x.values[d];
          const st=statusForValue(raw,c);
          if(!st){return}
          const n=st.name.toLowerCase();
          if(n==='terminado') done++;
          else if(n==='en proceso') process++;
          else if(n==='pendiente') pending++;
          else other++;
        });
        rows+=`<tr>
          <td>${esc(b.name)}</td>
          <td>${esc(c.name)}</td>
          <td>${esc(x.name)}</td>
          <td style="text-align:center">${done}</td>

          <td style="text-align:center">${pending}</td>
          <td style="text-align:center">${other}</td>
        </tr>`;
      });
    });
  });
  body.innerHTML=rows||'<tr><td colspan="7" style="text-align:center;padding:25px;color:#6b7280">Todavía no hay conceptos para consolidar.</td></tr>';
}

function pasteCategory(){
  const b=state.buildings.find(x=>x.id===currentId);
  if(!b)return;
  const raw=localStorage.getItem(CATEGORY_CLIPBOARD);
  if(!raw){alert('No hay ninguna categoría copiada. Primero usa “📋 Copiar”.');return;}
  let data;
  try{data=JSON.parse(raw);}catch(e){alert('La información copiada no es válida.');return;}
  if(!data||!data.name){alert('La información copiada no es válida.');return;}

  let name=data.name;
  if(b.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
    let n=2;
    while(b.categories.some(c=>c.name.toLowerCase()===(name+' (copia '+n+')').toLowerCase()))n++;
    name=name+' (copia '+n+')';
  }

  const copiedStatuses=Array.isArray(data.statuses)&&data.statuses.length?data.statuses:DEFAULT_STATUSES;
  const category={
    id:uid(),
    name,
    color:data.color||'#8eb9d9',
    fontSize:data.fontSize||11,
    fontColor:data.fontColor||'#111111',
    visible:true,
    concepts:[],
    statuses:copiedStatuses.map(st=>({id:uid(),name:st.name,color:st.color||'#e7e6e6',textColor:st.textColor||'#111111',mode:st.mode||'normal'}))
  };
  (Array.isArray(data.concepts)?data.concepts:[]).forEach(x=>{
    category.concepts.push({id:uid(),name:x.name,color:x.color||'#b9d8f0',fontColor:x.fontColor||'#111111',values:{}});
  });

  b.categories.push(category);
  save();
  renderMatrix();
  alert('Categoría pegada correctamente con '+category.concepts.length+' concepto(s). Los avances/estatus de las celdas no se copiaron.');
}

function syncMatrixColumnWidths(){
 const b=state.buildings.find(x=>x.id===currentId);
 if(!b)return;
 // Ancho base compacto. Solo crece cuando un estatus usado en esa columna
 // realmente necesita más espacio. Esto evita ensanchar todas las columnas.
 const widths=depts.map(()=>34);
 const getWidth=maxChars=>{
   if(maxChars<=7) return 34;
   return Math.max(34,Math.min(72,Math.ceil(maxChars*5.5+8)));
 };
 depts.forEach((d,i)=>{
   let maxChars=0;
   (b.categories||[]).filter(c=>c.visible!==false).forEach(c=>{
     (c.concepts||[]).forEach(x=>{
       const raw=x.values&&x.values[d];
       const st=statusForValue(raw,c);
       if(st){
         const display=st.mode==='quantity' ? String(raw?.quantity??'') : String(st.name||'');
         maxChars=Math.max(maxChars,display.trim().length);
       }
     });
   });
   widths[i]=getWidth(maxChars);
 });

function openProjectSummary(){
  const b=state.buildings.find(x=>x.id===currentId);
  if(!b)return;
  closeProjectSummary();

  const fmt=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:2});
  const escHtml=x=>esc(String(x??''));

  // El resumen agrupa por piso/edificio: cada nivel muestra sus cuatro departamentos.
  // Nivel 1 (100) = 101, 102, 103, 104
  // Nivel 2 (200) = 201, 202, 203, 204
  // Nivel 3 (300) = 301, 302, 303, 304
  // Nivel 4 (400) = 401, 402, 403, 404
  // Cada departamento conserva su valor individual y después se calcula el subtotal.
  // En estatus de tipo Cantidad se suma el valor real capturado, incluidos negativos.
  const levelGroups=[
    {name:'Nivel 1 (100)',depts:['101','102','103','104']},
    {name:'Nivel 2 (200)',depts:['201','202','203','204']},
    {name:'Nivel 3 (300)',depts:['301','302','303','304']},
    {name:'Nivel 4 (400)',depts:['401','402','403','404']}
  ];

  const getStatus=(cat,v)=>{
    if(!v)return null;
    const sts=Array.isArray(cat.statuses)?cat.statuses:[];
    if(typeof v==='string'){
      return sts.find(x=>String(x.name||'').trim().toLowerCase()===v.trim().toLowerCase())||null;
    }
    return sts.find(x=>x.id===v.statusId)||null;
  };
  const statusKey=st=>String(st?.name||'').trim().toLowerCase();

  // Resumen por categoría: una categoría debajo de otra.
  // ESTATUS en filas y NIVELES 1-4 en columnas para que los cuatro niveles
  // se vean simultáneamente en el celular.
  const lightStatusColor=(hex,amount=0.58)=>{
    hex=String(hex||'').trim();
    if(!/^#[0-9a-fA-F]{6}$/.test(hex)) return '#f1f4f7';
    const n=parseInt(hex.slice(1),16);
    const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const mix=v=>Math.round(v+(255-v)*amount);
    return '#'+[mix(r),mix(g),mix(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
  };

  let categoryTable='<div class="category-summary-list">';

  (b.categories||[]).forEach(cat=>{
    if(cat.visible===false)return;
    const concepts=Array.isArray(cat.concepts)?cat.concepts:[];
    const sts=Array.isArray(cat.statuses)?cat.statuses:[];

    const usedKeys=new Set();
    concepts.forEach(con=>levelGroups.forEach(level=>level.depts.forEach(dept=>{
      const st=getStatus(cat,con.values&&con.values[dept]);
      if(st)usedKeys.add(statusKey(st));
    })));
    const ownStatuses=sts.filter(st=>usedKeys.has(statusKey(st)));

    categoryTable+='<div class="category-summary-card">';
    categoryTable+='<div class="category-summary-title">'+escHtml(cat.name||'Sin categoría')+'</div>';

    if(!ownStatuses.length){
      categoryTable+='<div class="category-summary-empty">Sin estatus registrados</div></div>';
      return;
    }

    categoryTable+='<div class="category-level-table-wrap">';
    categoryTable+='<table class="category-level-table category-status-matrix"><thead><tr>';
    categoryTable+='<th>ESTATUS</th>';
    levelGroups.forEach(level=>{
      categoryTable+='<th>'+escHtml(level.name)+'</th>';
    });
    categoryTable+='<th>TOTALES</th></tr></thead><tbody>';

    const grand={};
    ownStatuses.forEach(st=>grand[statusKey(st)]=0);

    ownStatuses.forEach(st=>{
      const sk=statusKey(st);
      const strongBg=st.color||'#e7e6e6';
      const strongFg=st.textColor||'#111111';
      let allTotal=0;
      categoryTable+='<tr>';
      categoryTable+='<td class="category-status-label" style="background:'+strongBg+';color:'+strongFg+';font-weight:800">'+escHtml(st.name)+'</td>';

      levelGroups.forEach(level=>{
        let n=0;
        level.depts.forEach(dept=>{
          concepts.forEach(con=>{
            const v=con.values&&con.values[dept];
            const cellSt=getStatus(cat,v);
            if(!cellSt || statusKey(cellSt)!==sk)return;
            if(cellSt.mode==='quantity'){
              const q=Number(v && typeof v==='object' ? v.quantity : NaN);
              if(Number.isFinite(q))n+=q;
            }else n+=1;
          });
        });
        allTotal+=n;
        grand[sk]+=n;
        const zero=n===0;
        const fg=zero?'#5b6168':strongFg;
        categoryTable+='<td class="'+(zero?'category-status-zero':'category-status-number')+'" style="background:'+lightStatusColor(strongBg)+';color:'+fg+'">'+fmt(n)+'</td>';
      });

      const zero=allTotal===0;
      categoryTable+='<td class="'+(zero?'category-status-zero':'category-status-number')+'" style="background:'+lightStatusColor(strongBg)+';color:'+(zero?'#5b6168':strongFg)+';font-weight:900">'+fmt(allTotal)+'</td>';
      categoryTable+='</tr>';
    });

    // Totales de la categoría: cada nivel y el total general conservan
    // el color relacionado con el estatus correspondiente.
    categoryTable+='<tr class="category-total-row"><td>TOTALES</td>';
    levelGroups.forEach(level=>{
      let levelTotal=0;
      ownStatuses.forEach(st=>{
        const sk=statusKey(st);
        level.depts.forEach(dept=>{
          concepts.forEach(con=>{
            const v=con.values&&con.values[dept];
            const cellSt=getStatus(cat,v);
            if(!cellSt || statusKey(cellSt)!==sk)return;
            if(cellSt.mode==='quantity'){
              const q=Number(v && typeof v==='object' ? v.quantity : NaN);
              if(Number.isFinite(q))levelTotal+=q;
            }else levelTotal+=1;
          });
        });
      });
      categoryTable+='<td>'+fmt(levelTotal)+'</td>';
    });
    const totalGeneral=Object.values(grand).reduce((a,v)=>a+Number(v||0),0);
    categoryTable+='<td>'+fmt(totalGeneral)+'</td></tr>';
    categoryTable+='</tbody></table></div></div>';
  });

  categoryTable+='</div>';

  const h='<div id="projectSummary" class="summary-overlay">'
    +'<div class="summary-bar">'
    +'<button type="button" class="btn" onclick="closeProjectSummary()">← Regresar</button>'
    +'<strong>📊 Resumen por categoría · '+escHtml(b.name)+'</strong>'
    +'<button type="button" class="btn" onclick="window.print()">🖨 Imprimir</button>'
    +'<button type="button" class="btn" onclick="openLevelSummary()">📋 Resumen por niveles</button>'
    +'</div>'
    +'<div class="summary-paper">'
    +'<div class="summary-building-title">'+escHtml(b.name)+'</div>'
    +'<div class="summary-note">Cada categoría muestra únicamente sus propios estatus por nivel. Nivel 1 (100) = 101/102/103/104, Nivel 2 (200) = 201/202/203/204, Nivel 3 (300) = 301/302/303/304 y Nivel 4 (400) = 401/402/403/404. Los estatus de tipo Cantidad suman las cantidades reales capturadas, incluyendo valores negativos.</div>'
    +'<div class="summary-section"><h3>Resumen por categoría</h3>'+categoryTable+'</div>'
    +'</div></div>';

  document.body.insertAdjacentHTML('beforeend',h);
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
}

      concepts.forEach(con=>{
        const v=con.values&&con.values[dept];
        const cellSt=getStatus(cat,v);
        if(!cellSt || statusKey(cellSt)!==statusKey(st))return;
        if(cellSt.mode==='quantity'){
          const q=Number(v && typeof v==='object' ? v.quantity : NaN);
          if(Number.isFinite(q))n+=q;
        }else n+=1;
      });
      return n;
    };

    if(ownStatuses.length){
      ownStatuses.forEach(st=>{
        const bg=lightStatusColor(st.color||'#e7e6e6');
        const fg=st.textColor||'#111';
        let grand=0;
        tbl+='<tr><td class="level-status-name" style="background:'+(st.color||'#e7e6e6')+';color:'+fg+';font-weight:800">'+escHtml(st.name)+'</td>';
        levels.forEach(level=>level.depts.forEach(dept=>{
          const n=calcCell(st,dept); grand+=n;
          tbl+='<td class="'+(n===0?'level-summary-zero':'level-summary-number')+'" style="background:'+bg+';color:'+(n===0?'#666':fg)+'">'+fmt(n)+'</td>';
        }));
        tbl+='<td class="level-summary-number level-status-total" style="background:'+bg+';color:'+fg+'">'+fmt(grand)+'</td></tr>';
      });
    }else{
      tbl+='<tr><td class="level-status-name">Sin estatus</td>';
      for(let i=0;i<16;i++)tbl+='<td class="level-summary-zero">0</td>';
      tbl+='<td class="level-summary-zero">0</td></tr>';
    }

    // Totales por departamento de esta categoría.
    tbl+='<tr class="level-summary-level-total"><td>TOTALES</td>';
    let categoryGrand=0;
    levels.forEach(level=>level.depts.forEach(dept=>{
      let total=0;
      concepts.forEach(con=>{
        const v=con.values&&con.values[dept];
        const st=getStatus(cat,v);
        if(!st || !ownStatuses.some(x=>statusKey(x)===statusKey(st)))return;
        if(st.mode==='quantity'){
          const q=Number(v && typeof v==='object' ? v.quantity : NaN);
          if(Number.isFinite(q))total+=q;
        }else total+=1;
      });
      categoryGrand+=total;
      tbl+='<td>'+fmt(total)+'</td>';
    }));
    tbl+='<td>'+fmt(categoryGrand)+'</td></tr>';
    tbl+='</tbody></table></div></div>';
    html+=tbl;
  });

  if(!html)html='<div class="level-summary-card"><div class="level-summary-title">Sin datos</div><div style="padding:14px">No hay categorías o conceptos registrados para mostrar.</div></div>';

  const h='<div id="levelSummary" class="level-summary-overlay">'
    +'<div class="level-summary-bar">'
    +'<button type="button" class="btn" onclick="closeLevelSummary()">← Regresar</button>'
    +'<strong>📊 Resumen por niveles · '+escHtml(b.name)+'</strong>'
    +'<button type="button" class="btn" onclick="window.print()">🖨 Imprimir</button>'
    +'</div>'
    +'<div class="level-summary-paper">'
    +'<div class="level-summary-building-title">'+escHtml(b.name)+'</div>'
    +'<div class="summary-note">Cada categoría aparece una debajo de otra. Cada nivel está separado en sus departamentos 1, 2, 3 y 4: Nivel 1 = 101–104, Nivel 2 = 201–204, Nivel 3 = 301–304 y Nivel 4 = 401–404. Pellizca con dos dedos para ampliar o reducir la tabla. Los estatus de tipo Cantidad conservan sus cantidades reales, incluyendo valores negativos.</div>'
    +html
    +'</div></div>';

  document.body.insertAdjacentHTML('beforeend',h);
  document.body.style.overflow='hidden';
  document.documentElement.style.overflow='hidden';
}

function closeLevelSummary(){
  const p=document.getElementById('levelSummary');
  if(p)p.remove();
  document.body.style.overflow='';
  document.documentElement.style.overflow='';
}

function closeProjectSummary(){
  const p=document.getElementById('projectSummary');
  if(p)p.remove();
  document.body.style.overflow='';
  document.documentElement.style.overflow='';
}

function openProjectPreview(){
  const b=state.buildings.find(x=>x.id===currentId); if(!b)return;
  let rows='';
  rows+='<thead><tr><th class="preview-concept-head" rowspan="2">CONCEPTO</th>';
  rows+='<th class="preview-level" colspan="4">100</th><th class="preview-sep"></th>';
  rows+='<th class="preview-level" colspan="4">200</th><th class="preview-sep"></th>';
  rows+='<th class="preview-level" colspan="4">300</th><th class="preview-sep"></th>';
  rows+='<th class="preview-level" colspan="4">400</th></tr><tr>';
  depts.forEach((d,i)=>{rows+='<th class="preview-dept">'+d.slice(-1)+'</th>';if([3,7,11].includes(i))rows+='<th class="preview-sep"></th>';});
  rows+='</tr></thead><tbody>';
  b.categories.forEach(cat=>{
    if(cat.visible===false) return;
    const catColor=cat.color||'#8eb9d9', catFont=cat.fontColor||'#111111';
    rows+='<tr class="preview-cat"><td class="preview-concept-cell" style="background:'+catColor+';color:'+catFont+';font-size:'+(cat.fontSize||11)+'px">'+esc(cat.name)+'</td>';
    depts.forEach((d,i)=>{rows+='<td style="background:'+catColor+'"></td>';if([3,7,11].includes(i))rows+='<td class="preview-sep"></td>';});
    rows+='</tr>';
    const sts=Array.isArray(cat.statuses)?cat.statuses:[];
    (cat.concepts||[]).forEach(con=>{
      rows+='<tr><td class="preview-concept-cell preview-concept" style="background:'+(con.color||'#fff')+';color:'+(con.fontColor||'#111111')+'">'+esc(con.name)+'</td>';
      depts.forEach((d,i)=>{
        const v=con.values&&con.values[d];
        const st=v?sts.find(x=>x.id===v.statusId):null;
        const label=st?(st.mode==='quantity' ? esc(v.quantity??'') : esc(st.name)):'';
        const textColor=st?.textColor||'#111111';
        const long=label.length>9?' status-long':'';
        rows+='<td class="preview-dept'+long+'" style="background:'+(st?st.color:'#fff')+';color:'+textColor+'">'+label+'</td>';
        if([3,7,11].includes(i))rows+='<td class="preview-sep"></td>';
      });
      rows+='</tr>';
    });
    rows+='<tr class="preview-add-row"><td class="preview-concept-cell">+ Agregar concepto</td>';
    depts.forEach((d,i)=>{rows+='<td></td>';if([3,7,11].includes(i))rows+='<td class="preview-sep"></td>';});
    rows+='</tr>';
  });
  rows+='</tbody>';
  const colDefs='<colgroup><col class="preview-concept-col" style="width:120px">'+depts.map((d,i)=>'<col class="preview-dept-col" style="width:43px">'+([3,7,11].includes(i)?'<col class="preview-sep-col" style="width:9px">':'')).join('')+'</colgroup>';
  const table='<table class="preview-table">'+colDefs+rows+'</table>';
  const h='<div id="projectPreview" class="preview-screen"><div class="preview-bar"><button type="button" id="previewBackBtn" class="btn" onclick="event.preventDefault();event.stopPropagation();closeProjectPreview();">← Regresar</button><strong>Vista previa · '+esc(b.name)+'</strong><button class="btn" type="button" onclick="openExpandedPreview()">⛶ Vista previa ampliada</button><button class="btn" onclick="window.print()">🖨 Imprimir</button></div><div class="preview-paper"><h2>'+esc(b.name)+'</h2><div class="preview-sub">Control general del proyecto</div><div class="preview-grid"><div class="preview-move" id="previewMove">'+table+'</div></div><div class="preview-foot">Vista de revisión del proyecto</div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
}
